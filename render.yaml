services:
  - type: web
    name: ecg-guard
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/yuraira/ecg-guard
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /_stcore/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8501"
      - key: ECG_GUARD_CHECKPOINT
        value: /tmp/ecg-guard/best_model.pt
      - key: ECG_GUARD_FETCH_CHECKPOINT_AT_STARTUP
        value: "1"
      - key: ECG_GUARD_DEVICE
        value: cpu
      - key: ECG_GUARD_VERIFY_CHECKPOINT_AT_STARTUP
        value: "1"
      - key: ECG_GUARD_ENABLE_SYNTHETIC_DEMO
        value: "1"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
