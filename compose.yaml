services:
  ecg-guard:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
    image: ecg-guard:baseline-v1
    container_name: ecg-guard
    init: true
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      ECG_GUARD_CHECKPOINT: /models/best_model.pt
      ECG_GUARD_DEVICE: cpu
      ECG_GUARD_VERIFY_CHECKPOINT_AT_STARTUP: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - type: bind
        source: ./outputs/baseline/best_model.pt
        target: /models/best_model.pt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: "no"
